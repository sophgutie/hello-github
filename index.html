<!DOCTYPE html>
<html>
  <head>
    <title>Mini Message Board</title>
  </head>
  <body>
    <h1>Message Board</h1>

    <form method="POST">
      <input type="text" name="message" placeholder="Type a message">
      <button type="submit">Post</button>
    </form>

    <h2>Messages:</h2>
    <ul>
      {% for msg in messages %}
          <li>{{ msg[0] }}</</li>
      {% endfor %}
    </ul>
  </body>
</html>
